services:
  api:
    build: .
    env_file: .env
    environment:
      HOST: 0.0.0.0
      DATA_DIR: /app/data
    volumes:
      - ./data:/app/data
    ports:
      - '127.0.0.1:3001:3001'
    restart: unless-stopped
  web:
    image: nginx:stable-alpine
    ports:
      - '127.0.0.1:8080:80'
    volumes:
      - ./apps/web/dist:/usr/share/nginx/html:ro
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    restart: unless-stopped
