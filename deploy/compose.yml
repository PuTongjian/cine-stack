services:
  api:
    build:
      context: ${BUILD_CONTEXT:-..}
      dockerfile: deploy/Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:24-bookworm-slim}
        NGINX_IMAGE: ${NGINX_IMAGE:-nginx:stable-alpine}
      target: api
    env_file: .env
    environment:
      HOST: 0.0.0.0
      DATA_DIR: /app/data
      PORT: 3001
      STRM_OUTPUT_DIR: /app/strm
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:8080}
      NODE_USE_ENV_PROXY: '1'
      HTTP_PROXY: ${OUTBOUND_PROXY:-}
      HTTPS_PROXY: ${OUTBOUND_PROXY:-}
      NO_PROXY: ${OUTBOUND_NO_PROXY:-localhost,127.0.0.1,api,web,.quark.cn,.quarkcdn.com,.suenen.com}
    volumes:
      - ./data:/app/data
      - ${STRM_HOST_DIR:-./strm}:/app/strm
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    restart: unless-stopped
  web:
    build:
      context: ${BUILD_CONTEXT:-..}
      dockerfile: deploy/Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:24-bookworm-slim}
        NGINX_IMAGE: ${NGINX_IMAGE:-nginx:stable-alpine}
      target: web
    ports:
      - '${APP_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-8080}:80'
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
