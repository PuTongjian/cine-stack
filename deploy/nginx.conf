server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  location /api/ {
    proxy_pass http://api:3001;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_buffering off;
    proxy_read_timeout 600s;
  }
  location / { try_files $uri $uri/ /index.html; }
}
